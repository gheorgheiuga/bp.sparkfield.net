<!doctype html><html lang="en" data-theme="light"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Horizon Initiatives | Blue Projects</title>
<style>
:root{
  --brand:#1D2341;--head:#1D2341;--ink:#222838;--teal:#23B5D3;--dteal:#14829B;--grey:#5A6478;--muted:#8A93A6;
  --card:#EEF2F9;--pale:#E0E7F3;--bg:#F5F7FB;--surface:#FFFFFF;--line:#DDE3EE;--line2:#EDF0F6;
  --field:#FFFFFF;--fieldline:#CFD6E3;--hover:#F7F9FD;--grid:#E8ECF3;--axis:#C9D1DF;--emptycell:#F1F4F9;--quad:#EEF7F9;
  --c1:#4C63B6;--c2:#14A3B8;--c3:#D08A2E;--stIdea:#9AA3B2;--stScale:#1D2341;
  --good:#2E7D4F;--goodbg:#E3F3EA;--warn:#9A6212;--warnbg:#FBF0DC;--bad:#B23A3A;--badbg:#F8E3E3;--neutbg:#EEF0F4;
  --shadow:0 10px 30px rgba(29,35,65,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --head:#E8ECF6;--ink:#E1E5EE;--dteal:#3CC3DC;--grey:#A3ACBF;--muted:#7B8499;
  --card:#1E2438;--pale:#2A3150;--bg:#10131E;--surface:#171B2A;--line:#2A3044;--line2:#232839;
  --field:#10131E;--fieldline:#39405A;--hover:#1D2233;--grid:#252B3D;--axis:#3A4158;--emptycell:#1C2131;--quad:#15283A;
  --c1:#7D7EE0;--c2:#14A596;--c3:#C3822A;--stIdea:#6B7489;--stScale:#E0E7F3;
  --good:#6FCB95;--goodbg:#173A28;--warn:#E4B15E;--warnbg:#3A2C12;--bad:#EE8A8A;--badbg:#3F1D1D;--neutbg:#252B3D;--shadow:0 10px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{color-scheme:dark;
  --head:#E8ECF6;--ink:#E1E5EE;--dteal:#3CC3DC;--grey:#A3ACBF;--muted:#7B8499;
  --card:#1E2438;--pale:#2A3150;--bg:#10131E;--surface:#171B2A;--line:#2A3044;--line2:#232839;
  --field:#10131E;--fieldline:#39405A;--hover:#1D2233;--grid:#252B3D;--axis:#3A4158;--emptycell:#1C2131;--quad:#15283A;
  --c1:#7D7EE0;--c2:#14A596;--c3:#C3822A;--stIdea:#6B7489;--stScale:#E0E7F3;
  --good:#6FCB95;--goodbg:#173A28;--warn:#E4B15E;--warnbg:#3A2C12;--bad:#EE8A8A;--badbg:#3F1D1D;--neutbg:#252B3D;--shadow:0 10px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Calibri,"Segoe UI",Carlito,Arial,sans-serif;margin:0}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--head);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

header{background:var(--brand);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hbar{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand img{height:34px;width:auto;display:block;border-radius:2px}
.brand span{color:#E0E7F3;font-family:Georgia,serif;font-size:17px;border-left:1px solid rgba(255,255,255,.25);padding-left:12px}
#sync{font-size:12px;color:#B8C2D6;display:flex;align-items:center;gap:6px}
#sync i{width:7px;height:7px;border-radius:50%;background:#5FD08E;display:inline-block}
#sync.off i{background:#E4B15E}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid transparent;color:#E0E7F3;padding:7px 12px;border-radius:6px;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{border-color:var(--teal);color:#fff}
nav button.cta{background:var(--teal);color:#1D2341;font-weight:700}
.menu{position:relative}
.menu .dd{position:absolute;right:0;top:40px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:240px;padding:6px}
.dd button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:5px;cursor:pointer;color:var(--ink)}
.dd button:hover{background:var(--card)}
.dd hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.dd .lbl{font-size:11px;color:var(--muted);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.08em}

main{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:22px 60px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dteal);display:flex;align-items:center;gap:8px}
.kicker:before{content:"";width:10px;height:10px;background:var(--teal)}
.ptitle{font-size:26px;margin:4px 0}
.sub{color:var(--grey);margin:0 0 18px;max-width:80ch}

.grid{display:grid;gap:16px}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.card h3{font-size:16px;margin-bottom:2px}
.cap{color:var(--grey);font-size:12.5px;margin:0 0 10px}
.tile{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:12px 14px;min-width:0}
.tile .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);font-weight:700}
.tile .v{font-family:Georgia,serif;font-size:26px;color:var(--head);margin-top:4px;font-variant-numeric:tabular-nums}
.tile .n{font-size:12px;color:var(--grey)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.filters label{font-size:12px;color:var(--grey);display:flex;align-items:center;gap:6px}
.filters select{background:var(--field);border:1px solid var(--fieldline);border-radius:5px;padding:3px 6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--grey);margin-bottom:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:12px;fill:var(--grey)}
svg.chart text.v{fill:var(--ink);font-size:11.5px}
svg.chart text.q{fill:var(--muted);font-size:10.5px;letter-spacing:.08em}
svg.chart text.ink{fill:var(--ink)}
svg.chart text.onfill{fill:#fff}
svg.chart .gl{stroke:var(--grid)}
svg.chart .axis{stroke:var(--axis)}
.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}.fIdea{fill:var(--stIdea)}.fScale{fill:var(--stScale)}
.fEmpty{fill:var(--emptycell)}.fQuad{fill:var(--quad)}.fHit{fill:transparent}
.b1{background:var(--c1)}.b2{background:var(--c2)}.b3{background:var(--c3)}.bIdea{background:var(--stIdea)}.bScale{background:var(--stScale)}
circle.dot{stroke:var(--surface);stroke-width:2;fill-opacity:.9}
svg.chart [data-tip]:hover{opacity:.82}
.empty{color:var(--muted);font-style:italic;padding:18px 0;text-align:center}
#tip{position:fixed;pointer-events:none;background:#1D2341;color:#fff;padding:7px 10px;border-radius:6px;font-size:12.5px;line-height:1.35;max-width:280px;z-index:50;box-shadow:var(--shadow);white-space:pre-line}

table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);text-align:left;font-weight:700;padding:8px;border-bottom:2px solid var(--pale);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
td:first-child{white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
.reghead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sortbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--grey);margin-bottom:10px}
.sortbar select{background:var(--field);border:1px solid var(--fieldline);border-radius:6px;padding:5px 8px;font-size:13px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--head)}
th.sortable.on{color:var(--dteal)}
th .arr{margin-left:4px;font-size:9px;opacity:.55}
th.on .arr{opacity:1}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.st-Idea{background:var(--card);color:var(--grey)}
.st-Business{background:var(--pale);color:var(--c1)}
.st-Pilot{background:var(--card);color:var(--dteal);box-shadow:inset 0 0 0 1px var(--c2)}
.st-Scale{background:var(--head);color:var(--surface)}
.ok{background:var(--goodbg);color:var(--good)}
.wa{background:var(--warnbg);color:var(--warn)}
.ba{background:var(--badbg);color:var(--bad)}
.ne{background:var(--neutbg);color:var(--grey)}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:0 6px;border-radius:10px;margin-left:6px}
.pbar{height:8px;background:var(--line2);border-radius:4px;min-width:90px;position:relative;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--c2);border-radius:4px}
.note{background:var(--card);border-left:4px solid var(--teal);padding:10px 14px;border-radius:6px;color:var(--ink);font-size:13px;margin-bottom:14px}
.note a{color:var(--dteal)}

.wf{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:18px;align-items:start}
.steps{position:sticky;top:84px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:8px;cursor:pointer;position:relative}
.step:hover,.step.on{background:var(--card)}
.step.on:before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;background:var(--teal);border-radius:0 3px 3px 0}
.step .dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--pale);color:var(--grey);background:var(--surface)}
.step .dot span{display:inline-block}
.step.done .dot{background:var(--dteal);border-color:var(--dteal);color:var(--surface)}
.step.gate .dot{border-radius:5px;transform:rotate(45deg)}
.step.gate .dot span{transform:rotate(-45deg)}
.step.lock{opacity:.45;cursor:not-allowed}
.step b{display:block;color:var(--head);font-size:13.5px}
.step small{color:var(--grey);font-size:12px}
.side{position:sticky;top:84px;display:grid;gap:12px}
.side .card{padding:14px 16px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border:0}
.kv span{color:var(--grey)}
.kv b{font-variant-numeric:tabular-nums;color:var(--head);text-align:right}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--grey);margin-top:8px}
.who img{width:22px;height:22px;border-radius:50%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.panel h3{font-size:17px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.panel h3:before{content:"";width:4px;height:18px;background:var(--teal);border-radius:2px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.form .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:700;color:var(--grey);margin-bottom:4px}
.f input,.f select,.f textarea,td input,td select{width:100%;border:1px solid var(--fieldline);border-radius:6px;padding:7px 9px;background:var(--field)}
.f textarea{min-height:74px;resize:vertical}
td input,td select{padding:5px 7px;font-size:13px}
td input[type=number]{text-align:right}
input:disabled,select:disabled,textarea:disabled{opacity:.8;cursor:not-allowed}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
.score{display:flex;gap:6px}
.score button{width:34px;height:32px;border-radius:6px;border:1px solid var(--fieldline);background:var(--field);cursor:pointer;font-weight:700;color:var(--grey)}
.score button.on{background:var(--head);border-color:var(--head);color:var(--surface)}
.btn{border:1px solid var(--head);background:var(--head);color:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600}
.btn.sec{background:var(--surface);color:var(--head)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--bad)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.x:hover{color:var(--bad)}
.calc{text-align:right;font-weight:600;color:var(--head);white-space:nowrap;font-variant-numeric:tabular-nums}
.addrow{margin-top:8px}
.decision{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.decision button{flex:1;min-width:110px;padding:14px 10px;border-radius:9px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px;color:var(--grey)}
.decision button.on.Go,.decision button.on.Scale{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.decision button.on.Hold,.decision button.on.Iterate{border-color:var(--warn);background:var(--warnbg);color:var(--warn)}
.decision button.on.Stop{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;background:var(--hover)}
.chk input{width:17px;height:17px;accent-color:var(--dteal)}
.chk em{margin-left:auto;font-style:normal;font-size:12px}
.lockmsg{text-align:center;padding:50px 20px;color:var(--grey)}
.lockmsg h3{justify-content:center;font-size:22px;margin-bottom:6px}
.lockmsg h3:before{display:none}
.wfhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.wfhead .grow{flex:1;min-width:240px}
.navbtns{display:flex;justify-content:space-between;margin-top:6px}
.loading{padding:80px 0;text-align:center;color:var(--grey)}
.ro .addrow,.ro .x,.ro .rw{display:none!important}
.ro .score button,.ro .decision button,.ro .chk{pointer-events:none}
#modal{position:fixed;inset:0;background:rgba(10,12,20,.5);display:grid;place-items:center;z-index:60;padding:16px}
#modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:440px;width:100%;box-shadow:var(--shadow)}
#modal p{margin:8px 0 18px;color:var(--ink)}
#modal .acts{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1D2341;color:#fff;padding:9px 16px;border-radius:8px;z-index:70;box-shadow:var(--shadow);font-size:13px;max-width:calc(100% - 32px)}

@media (max-width:1100px){.wf{grid-template-columns:minmax(0,1fr)}.steps,.side{position:static}.steps{display:flex;overflow-x:auto}.step{min-width:150px}.step.on:before{display:none}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){header{position:static}.g2,.form,.form.three{grid-template-columns:minmax(0,1fr)}.g6{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding-inline:16px}.brand span{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><link rel="stylesheet" href="pipeline-shell.css">

<script>
/* ============================ CONSTANTS ============================ */
const DEF={rate:55,discount:8,horizon:3,ramp:50,contingency:10,successPct:80,
  teams:['Digital & AI','Project Management','Commercial & Procurement','Construction Management','Engineering & BIM','Finance','IT / InfoSec','External partner'],
  functions:['Project Management','Commercial & Procurement','Construction Management','Engineering & BIM','Finance','HR & People','H&S','Business Development','IT & Operations'],
  pillars:['Process Automation','BlueOS Platform','Data & AI Foundation','People & Adoption']};
const STREAMS=['Productivity & automation','Better project outcomes','Commercial growth','Cost avoidance'];
const KPICAT=['Adoption','Efficiency','Quality & risk','Value'];
const STAGES=['Idea','Business case','Pilot','Scale'];
const GATES={
  g0:{name:'Gate 0 — Idea screen',q:'Is this idea worth building a business case for?',opts:['Go','Hold','Stop'],
      checks:['Problem clearly described','Sponsor and owner named','Linked to a strategy pillar','Value, feasibility, fit and risk scored']},
  g1:{name:'Gate 1 — Business case approval',q:'Fund and launch a pilot?',opts:['Go','Hold','Stop'],
      checks:['Hours, software and hardware estimated','Every KPI has a baseline and target','Payback inside the evaluation horizon','Risks and mitigations logged','Data / InfoSec review completed']},
  g2:{name:'Gate 2 — Pilot review',q:'Scale across the business?',opts:['Scale','Iterate','Stop'],
      checks:['Pilot KPIs met or on track','Users have adopted the solution','Scale-up costs confirmed','Support and ownership model agreed']}
};
const STEPS=[{k:'idea',t:'Idea',s:'Gate 0 one-pager'},{k:'g0',t:'Gate 0',s:'Idea screen',gate:1},{k:'bc',t:'Business case',s:'Costs · benefits · KPIs'},
  {k:'g1',t:'Gate 1',s:'Approve pilot',gate:1},{k:'pilot',t:'Pilot',s:'Run and measure'},{k:'g2',t:'Gate 2',s:'Scale decision',gate:1},{k:'real',t:'Benefits',s:'Realisation 3 / 6 / 12 m'}];

/* ============================ HELPERS ============================ */
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const sum=(a,f)=>(a||[]).reduce((t,r)=>t+f(r),0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(3,'0');
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const CUR=ym(new Date());
const addM=(m,k)=>{const [y,mo]=m.split('-').map(Number);return ym(new Date(y,mo-1+k,1))};
const mDiff=(a,b)=>{const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)};
const mLabel=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleString('en-GB',{month:'short'})+' '+String(y).slice(2)};
const today=()=>new Date().toISOString().slice(0,10);
function eur(n,dp){if(n===null||n===undefined||!isFinite(n))return '—';const a=Math.abs(n),s=n<0?'−':'';
  if(a>=1e6)return s+'€'+(a/1e6).toFixed(dp??2)+'m';if(a>=1e4)return s+'€'+Math.round(a/1e3)+'k';if(a>=1e3)return s+'€'+(a/1e3).toFixed(1)+'k';return s+'€'+Math.round(a)}
const eurFull=n=>(n<-0.5?'−€':'€')+Math.abs(Math.round(n)).toLocaleString('en-GB');
const pct=n=>n===null||!isFinite(n)?'—':Math.round(n*100)+'%';
function ago(iso){if(!iso)return '';const s=(Date.now()-new Date(iso))/1000;if(s<90)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
function getPath(o,path){return path.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,path,v){const ks=path.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};a=a[ks[i]]}a[ks[ks.length-1]]=v}

/* ============================ STATE ============================ */
let S={settings:clone(DEF),projects:[]};
let UI={view:'dash',pid:null,step:0,f:{fn:'',stage:'',samples:true}};
let db=null,user=null,dls=null,ME=null,CAN_WRITE=false,IS_ADMIN=false,READY=false,NO_DB=false;
const P=id=>S.projects.find(p=>p.id===id);
function gate(){return {decision:'',date:'',by:'',notes:'',checks:[]}}
function shape(p){
  const b={idea:{title:'',owner:'',sponsor:'',function:'',pillar:'',problem:'',solution:'',beneficiaries:'',size:'S',value:3,feasibility:3,fit:3,risk:2},
    gates:{g0:gate(),g1:gate(),g2:gate()},
    bc:{start:addM(CUR,1),horizon:S.settings.horizon,contingency:S.settings.contingency,summary:'',labour:[],software:[],hardware:[],benefits:[],kpis:[],risks:[]},
    pilot:{start:'',end:'',scope:'',users:'',lessons:''},real:{m3:'',m6:'',m12:'',notes:''}};
  p.idea=Object.assign(b.idea,p.idea||{});p.gates=p.gates||{};
  for(const g of ['g0','g1','g2'])p.gates[g]=Object.assign(gate(),p.gates[g]||{});
  p.bc=Object.assign(b.bc,p.bc||{});for(const k of ['labour','software','hardware','benefits','kpis','risks'])if(!Array.isArray(p.bc[k]))p.bc[k]=[];
  p.pilot=Object.assign(b.pilot,p.pilot||{});p.real=Object.assign(b.real,p.real||{});return p}

/* ============================ CALC ============================ */
function stageOf(p){const g=p.gates;if(g.g0.decision!=='Go'&&!(p.pickedUp && !g.g0.decision))return 'Idea';if(g.g1.decision!=='Go')return 'Business case';if(g.g2.decision!=='Scale')return 'Pilot';return 'Scale'}
function statusOf(p){const st=stageOf(p),g={Idea:'g0','Business case':'g1',Pilot:'g2'}[st];if(!g)return 'Active';
  const d=p.gates[g].decision;return d==='Stop'?'Stopped':d==='Hold'?'On hold':d==='Iterate'?'Iterating':'Active'}
function priority(p){const i=p.idea;return Math.max(0,Math.round(((num(i.value)*.4+num(i.fit)*.3+num(i.feasibility)*.3)/5)*100-(num(i.risk)-1)*5))}
const rateOf=r=>r.rate===''||r.rate==null?S.settings.rate:num(r.rate);
const lineLabour=r=>num(r.hours)*rateOf(r);
const lineSwAnn=r=>num(r.seats)*num(r.monthly)*12;
const lineBen=r=>num(r.hoursPerMonth)*12*rateOf(r)+num(r.otherValue);
function calc(p){
  const s=S.settings,b=p.bc;
  const labour=sum(b.labour,lineLabour),hours=sum(b.labour,r=>num(r.hours));
  const swOne=sum(b.software,r=>num(r.oneOff)),swAnn=sum(b.software,lineSwAnn);
  const hwOne=sum(b.hardware,r=>num(r.oneOff)),hwAnn=sum(b.hardware,r=>num(r.annual));
  const base=labour+swOne+hwOne,cont=base*num(b.contingency)/100,invest=base+cont,run=swAnn+hwAnn;
  const benefit=sum(b.benefits,lineBen);
  const H=Math.max(1,Math.round(num(b.horizon)||s.horizon)),ramp=num(s.ramp)/100,dr=num(s.discount)/100;
  const years=[];let npv=-invest,tot=0;
  for(let y=1;y<=H;y++){const ben=benefit*(y===1?ramp:1),net=ben-run;years.push({y,ben,run,net});npv+=net/Math.pow(1+dr,y);tot+=net}
  let payback=null,cum=-invest;
  if(invest>0||run>0){for(let m=1;m<=H*12;m++){const y=Math.ceil(m/12);cum+=(benefit*(y===1?ramp:1)-run)/12;if(cum>=0){payback=m;break}}}
  const roi=invest>0?(tot-invest)/invest:null;
  const has=b.labour.length+b.software.length+b.hardware.length+b.benefits.length>0;
  return {labour,hours,swOne,swAnn,hwOne,hwAnn,cont,invest,run,benefit,years,npv,roi,payback,H,has,tot};
}
function kpiProg(k){const b=num(k.baseline),t=num(k.target);if(k.actual===''||k.actual==null||t===b)return null;
  const a=num(k.actual);return k.dir==='down'?(b-a)/(b-t):(a-b)/(t-b)}
function kpiStatus(k){const pr=kpiProg(k);if(pr===null)return ['Not measured','ne'];if(pr>=1)return ['Met','ok'];if(pr>=.7)return ['On track','wa'];return ['Off track','ba']}
function realised(p){const r=p.real;for(const k of ['m12','m6','m3'])if(r[k]!==''&&r[k]!=null)return {v:num(r[k]),at:k.slice(1)};return null}
function verdict(p){
  if(statusOf(p)==='Stopped')return ['Stopped','ne'];
  const rl=realised(p),c=calc(p);if(!rl||!c.benefit)return ['Pending','ne'];
  const rp=rl.v/c.benefit,ks=p.bc.kpis.filter(k=>kpiProg(k)!==null),met=ks.length?ks.filter(k=>kpiProg(k)>=1).length/ks.length:1;
  if(rp>=S.settings.successPct/100&&met>=.66)return ['Success','ok'];if(rp>=.5)return ['Partial','wa'];return ['Failure','ba']}
function unlocked(p,i){if(i<=1)return true;if(i<=3)return p.gates.g0.decision==='Go'||(p.pickedUp&&!p.gates.g0.decision);if(i<=5)return p.gates.g1.decision==='Go';return p.gates.g2.decision==='Scale'}
function stepDone(p,i){const c=calc(p);return [!!(p.idea.title&&p.idea.problem),!!p.gates.g0.decision,!!(p.bc.benefits.length&&p.bc.kpis.length&&c.invest),!!p.gates.g1.decision,!!p.pilot.start&&p.bc.kpis.some(k=>k.actual!==''&&k.actual!=null),!!p.gates.g2.decision,!!realised(p)][i]}
function autoChecks(p,g){const c=calc(p),i=p.idea,b=p.bc;
  if(g==='g0')return [!!i.problem,!!(i.sponsor&&i.owner),!!i.pillar,true];
  if(g==='g1')return [b.labour.length>0&&(b.software.length+b.hardware.length)>0,b.kpis.length>0&&b.kpis.every(k=>k.baseline!==''&&k.target!==''),c.payback!==null,b.risks.length>0,null];
  return [b.kpis.length>0&&b.kpis.every(k=>(kpiProg(k)??-1)>=.7),null,null,null]}

/* ============================ CHARTS ============================ */
function hpath(x,y,w,h,r){if(w<=0)return '';r=Math.min(r,w,h/2);return `M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`}
function vpath(x,y,w,h,r){if(h<=0)return '';r=Math.min(r,h,w/2);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function hbar(data,cls){
  if(!data.length)return '<div class="empty">No data for this filter</div>';
  const W=560,L=120,R=70,rh=36,H=data.length*rh+4,max=Math.max(1,...data.map(d=>d.v));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  data.forEach((d,i)=>{const y=i*rh+4,bh=20,w=(W-L-R)*d.v/max;
    s+=`<text x="${L-10}" y="${y+bh/2}" text-anchor="end" dominant-baseline="middle">${esc(d.l)}</text>`;
    s+=`<rect class="fHit" x="${L}" y="${y-4}" width="${W-L}" height="${bh+8}" data-tip="${esc(d.tip)}"/>`;
    if(d.v)s+=`<path class="${cls}" d="${hpath(L,y,Math.max(w,3),bh,4)}" data-tip="${esc(d.tip)}"/>`;
    s+=`<text class="v" x="${L+w+8}" y="${y+bh/2}" dominant-baseline="middle">${esc(d.lab)}</text>`});
  return s+`<line class="axis" x1="${L}" x2="${L}" y1="0" y2="${H}"/></svg>`}
function gbar(cats,series,fmt){
  if(!cats.length)return '<div class="empty">No projects with a business case for this filter</div>';
  const W=600,H=270,L=52,R=8,T=18,B=48,ph=H-T-B,pw=W-L-R;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.values)));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y}" text-anchor="end" dominant-baseline="middle">${fmt(max*i/4)}</text>`}
  const gw=pw/cats.length,bw=Math.min(26,(gw-18)/series.length-2);
  cats.forEach((c,ci)=>{const gx=L+ci*gw+(gw-(bw+2)*series.length+2)/2;
    s+=`<rect class="fHit" x="${L+ci*gw}" y="${T}" width="${gw}" height="${ph}" data-tip="${esc(c.full+'\n'+series.map(se=>se.name+': '+eurFull(se.values[ci])).join('\n'))}"/>`;
    series.forEach((se,si)=>{const v=se.values[ci],h=ph*v/max,x=gx+si*(bw+2);
      if(h>0)s+=`<path class="${se.cls}" d="${vpath(x,T+ph-h,bw,h,4)}" data-tip="${esc(c.full+'\n'+se.name+': '+eurFull(v))}"/>`;
      if(cats.length<=7&&v>0)s+=`<text class="v" x="${x+bw/2}" y="${T+ph-h-5}" text-anchor="middle" style="font-size:10.5px">${fmt(v)}</text>`});
    s+=`<text x="${L+ci*gw+gw/2}" y="${T+ph+16}" text-anchor="middle">${esc(c.l)}</text>`;
    if(c.l2)s+=`<text class="q" x="${L+ci*gw+gw/2}" y="${T+ph+31}" text-anchor="middle" style="letter-spacing:0">${esc(c.l2)}</text>`});
  return s+`<line class="axis" x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}"/></svg>`}
function matrix(pts){
  const W=560,H=330,L=44,R=14,T=14,B=40,pw=W-L-R,ph=H-T-B;
  const X=v=>L+(v-.5)/5*pw,Y=v=>T+ph-(v-.5)/5*ph;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><rect class="fQuad" x="${X(3)}" y="${T}" width="${X(5.5)-X(3)}" height="${Y(3)-T}"/>`;
  [['STRATEGIC BETS',X(.6),T+14,'start'],['QUICK WINS',X(5.4),T+14,'end'],['DEPRIORITISE',X(.6),T+ph-8,'start'],['FILL-INS',X(5.4),T+ph-8,'end']]
    .forEach(q=>s+=`<text class="q" x="${q[1]}" y="${q[2]}" text-anchor="${q[3]}">${q[0]}</text>`);
  for(let i=1;i<=5;i++){s+=`<line class="gl" x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${T+ph}"/><line class="gl" x1="${L}" x2="${W-R}" y1="${Y(i)}" y2="${Y(i)}"/>`;
    s+=`<text x="${X(i)}" y="${T+ph+15}" text-anchor="middle">${i}</text><text x="${L-10}" y="${Y(i)}" text-anchor="end" dominant-baseline="middle">${i}</text>`}
  s+=`<text x="${L+pw/2}" y="${H-4}" text-anchor="middle">Feasibility →</text><text transform="translate(12 ${T+ph/2}) rotate(-90)" text-anchor="middle">Value →</text>`;
  const seen={},maxI=Math.max(1,...pts.map(p=>p.inv));
  pts.sort((a,b)=>b.inv-a.inv).forEach(p=>{const k=p.x+'_'+p.y;const n=seen[k]=(seen[k]||0)+1;const off=(n-1)*14;
    const r=7+Math.sqrt(p.inv/maxI)*13,cx=X(p.x)+off,cy=Y(p.y)-off*.4;
    s+=`<circle class="dot ${p.cls}" cx="${cx}" cy="${cy}" r="${r}" data-tip="${esc(p.tip)}"/><text class="ink" x="${cx+r+4}" y="${cy}" dominant-baseline="middle" style="font-size:11px">${esc(p.id)}</text>`});
  return s+'</svg>'}
function heat(rows,cols,m){
  const mx=Math.max(0,...m.flat());if(!rows.length||!mx)return '<div class="empty">No planned hours in the next 12 months</div>';
  const W=1100,L=190,T=24,ch=30,cw=(W-L)/cols.length,H=T+rows.length*ch+4;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  cols.forEach((c,j)=>s+=`<text x="${L+j*cw+cw/2}" y="14" text-anchor="middle" style="font-size:11px">${mLabel(c)}</text>`);
  rows.forEach((r,i)=>{const y=T+i*ch;s+=`<text x="${L-10}" y="${y+ch/2}" text-anchor="end" dominant-baseline="middle">${esc(r)}</text>`;
    cols.forEach((c,j)=>{const v=m[i][j],a=v?0.18+0.72*v/mx:0,tip=`data-tip="${esc(r+' · '+mLabel(c)+'\n'+Math.round(v)+' hours planned')}"`;
      s+=v?`<rect x="${L+j*cw+1}" y="${y+1}" width="${cw-2}" height="${ch-2}" rx="3" style="fill:rgba(20,150,175,${a.toFixed(2)})" ${tip}/>`:`<rect class="fEmpty" x="${L+j*cw+1}" y="${y+1}" width="${cw-2}" height="${ch-2}" rx="3" ${tip}/>`;
      if(v)s+=`<text class="${a>.5?'onfill':'ink'}" x="${L+j*cw+cw/2}" y="${y+ch/2}" text-anchor="middle" dominant-baseline="middle" style="font-size:10.5px">${Math.round(v)}</text>`})});
  return s+'</svg>'}

/* ============================ VIEWS ============================ */
const app=document.getElementById('app');
function go(view,pid,step){UI.view=view;if(pid!==undefined)UI.pid=pid;if(step!==undefined)UI.step=step;render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll('nav [data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===UI.view));
  document.body.classList.toggle('ro',!CAN_WRITE);
  document.getElementById('newBtn').hidden=!CAN_WRITE;
  document.querySelector('.adm').hidden=!IS_ADMIN;
  document.querySelectorAll('.dl').forEach(b=>b.hidden=!dls);
  if(!READY){app.innerHTML='<div class="loading">Loading the shared pipeline…</div>';return}
  if(UI.view==='wf'&&!P(UI.pid))UI.view='dash';
  ({dash:vDash,reg:vReg,wf:vWf,set:vSet})[UI.view]();
  if(!CAN_WRITE)app.querySelectorAll('input,select,textarea').forEach(e=>{if(!e.dataset.flt)e.disabled=true});
  if(UI.view==='set'&&!IS_ADMIN)app.querySelectorAll('[data-set],[data-setlist]').forEach(e=>e.disabled=true);
}
function filtered(){const f=UI.f;return S.projects.filter(p=>(f.samples||!p.sample)&&(!f.fn||p.idea.function===f.fn)&&(!f.stage||stageOf(p)===f.stage))}
function filterBar(){const f=UI.f;
  return `<div class="filters"><label>Function <select id="fltFn" data-flt="fn"><option value="">All functions</option>${S.settings.functions.map(x=>`<option ${f.fn===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
  <label>Stage <select id="fltStage" data-flt="stage"><option value="">All stages</option>${STAGES.map(x=>`<option ${f.stage===x?'selected':''}>${x}</option>`).join('')}</select></label>
  <label><input type="checkbox" id="fltSamples" data-flt="samples" ${f.samples?'checked':''}> Include sample projects</label>
  <span style="margin-left:auto;color:var(--grey);font-size:12px">${filtered().length} of ${S.projects.length} projects</span></div>`}
const stPill=st=>`<span class="pill st-${st.split(' ')[0]}">${st}</span>`;
function statusPill(s){const c={Active:'ok','On hold':'wa',Iterating:'wa',Stopped:'ba'}[s]||'ne';return `<span class="pill ${c}">${s}</span>`}
const NOTICE=()=>`<div class="note">Local prototype: records are stored in this browser only. No SSO or role permissions are enforced. Financial figures and decisions are estimates until validated.</div>`;

function vDash(){
  const ps=filtered(),live=ps.filter(p=>statusOf(p)!=='Stopped'),C=Object.fromEntries(ps.map(p=>[p.id,calc(p)]));
  const approved=live.filter(p=>p.gates.g1.decision==='Go'),withBC=live.filter(p=>stageOf(p)!=='Idea'&&C[p.id].has);
  const inv=sum(approved,p=>C[p.id].invest),ben=sum(withBC,p=>C[p.id].benefit);
  const invBC=sum(withBC,p=>C[p.id].invest),totNet=sum(withBC,p=>C[p.id].tot);
  const roi=invBC?(totNet-invBC)/invBC:null;
  const pb=withBC.map(p=>C[p.id].payback).filter(x=>x!==null),avgPb=pb.length?pb.reduce((a,b)=>a+b,0)/pb.length:null;
  const rl=live.filter(p=>realised(p)),claimed=sum(rl,p=>C[p.id].benefit),real=sum(rl,p=>realised(p).v);
  const tiles=[
    ['Projects in pipeline',live.length,`${ps.length-live.length} stopped · ${live.filter(p=>statusOf(p)==='On hold').length} on hold`],
    ['Approved investment',eur(inv),`${approved.length} past Gate 1`],
    ['Projected annual benefit',eur(ben),`${withBC.length} business case${withBC.length===1?'':'s'}`],

function fld(label,k,val,type='text',opts){const full=type==='area'||opts?.full?' full':'',id='f_'+k.replace(/\./g,'_');
  if(type==='area')return `<div class="f${full}"><label for="${id}">${label}</label><textarea id="${id}" data-k="${k}" placeholder="${esc(opts?.ph||'')}">${esc(val)}</textarea></div>`;
  if(type==='select')return `<div class="f${full}"><label for="${id}">${label}</label><select id="${id}" data-k="${k}"><option value="">Select…</option>${opts.list.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;

function scoreF(label,k,val,hint){return `<div class="f"><label>${label} <span style="font-weight:400;color:var(--muted)">${hint}</span></label><div class="score">${[1,2,3,4,5].map(n=>`<button type="button" data-score="${k}" data-v="${n}" class="${num(val)===n?'on':''}">${n}</button>`).join('')}</div></div>`}

    if(c.type==='select')return `<td style="min-width:${c.w||120}px"><select ${a}>${c.opts().map(o=>`<option ${o===r[c.f]?'selected':''}>${esc(o)}</option>`).join('')}</select></td>`;
    if(c.type==='dir')return `<td style="min-width:95px"><select ${a}><option value="up" ${r[c.f]!=='down'?'selected':''}>↑ up</option><option value="down" ${r[c.f]==='down'?'selected':''}>↓ down</option></select></td>`;

const dirty=new Set(),inflight=new Set(),pendingCreate=new Set();let serverIds=new Set(),errShown=false;let flushT=null,flushing=false,setT=null,pendingRR=false;
function sync(txt,ok=true){document.getElementById('syncTxt').textContent=txt;document.getElementById('sync').classList.toggle('off',!ok)}
function touch(p){p.updatedAt=new Date().toISOString();p.updatedBy='Local user';localSave();sync('Saved in this browser')}
async function flush(){if(flushing){clearTimeout(flushT);flushT=setTimeout(flush,300);return}flushing=true;
  const ids=[...dirty];dirty.clear();
  for(const id of ids){const p=P(id);if(!p)continue;inflight.add(id);
    try{await db.doc('projects/'+id).set(clone(p))}
    catch(e){await writeErr(e,()=>{dirty.add(id)})}
    
    finally{inflight.delete(id)}}
  flushing=false;if(dirty.size){flushT=setTimeout(flush,2500)}else{errShown=false;sync('All changes saved')}}
async function writeErr(e,retry){const c=e&&e.code;
  if(c==='invalid_argument'){CAN_WRITE=false;toast('Your changes could not be saved: you have view-only access.');render()}
  else if(c==='quota_exceeded'){toast('The pipeline is full. Delete old projects to add new ones.')}
  else if(c==='revoked'||c==='not_granted'){CAN_WRITE=false;render()}
  else{sync('Not saved yet — retrying…',false);if(!errShown){errShown=true;toast('Couldn’t save yet ('+(c||'error')+'). Retrying automatically — keep this page open.')}retry&&retry()}}
function editing(){const a=document.activeElement;return a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
function onProjects(snap){
  const incoming={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.idea)incoming[d.id]=x});
  let changedOpen=false,ownEcho=false,any=!READY;const next=[];
  for(const [id,data] of Object.entries(incoming)){const local=P(id);
    if(local&&(dirty.has(id)||inflight.has(id))){next.push(local);continue}
    const shaped=shape(Object.assign(clone(data),{id}));
    if(local&&stable(local)===stable(shaped)){next.push(local);continue}
    next.push(shaped);any=true;if(id===UI.pid&&data.updatedBy!==ME)changedOpen=true;else if(id===UI.pid)ownEcho=true}
  Object.keys(incoming).forEach(id=>pendingCreate.delete(id));
  S.projects.forEach(p=>{if(!incoming[p.id]&&(dirty.has(p.id)||inflight.has(p.id)||pendingCreate.has(p.id)))next.push(p)});
  const prevServer=serverIds;serverIds=new Set(Object.keys(incoming));
  if(next.length!==S.projects.length)any=true;
  S.projects=next.sort((a,b)=>a.id.localeCompare(b.id));
  if(!snap.metadata.fromCache&&!dirty.size&&!inflight.size)sync('Live · all changes saved');
  if(!READY){READY=true;render();return}
  if(!any)return;
  if(UI.view==='wf'){if(!P(UI.pid)){if(prevServer.has(UI.pid)){toast('This project was deleted by a colleague.');go('dash')}return}
    if(changedOpen){if(editing())pendingRR=true;else{render();toast('Updated with a colleague’s changes')}}}
  else if(UI.view!=='set'&&!editing())render();else pendingRR=true}
function onSettings(snap){if(!snap.exists)return;const d=snap.data();
  const nextS=Object.assign(clone(DEF),d);if(stable(nextS)===stable(S.settings))return;
  if(setT)return;S.settings=nextS;if(READY){if(editing())pendingRR=true;else render()}}

  try{for(let i=0;i<5;i++){const sn=await db.doc('projects/HZ-'+pad(n)).get();if(sn.exists&&sn.data()?.idea)n++;else break}}catch(e){}
  const id='HZ-'+pad(n);

  save('horizon-register-'+today()+'.csv','﻿'+[h,...rows].map(r=>r.map(q).join(',')).join('\n'))}
